# Nginx config for stolix.ru — management portal (Docker)
# Place at /etc/nginx/sites-available/stolix.conf
# Then: ln -s /etc/nginx/sites-available/stolix.conf /etc/nginx/sites-enabled/

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name stolix.ru www.stolix.ru;
    return 301 https://stolix.ru$request_uri;
}

# www → apex redirect
server {
    listen 443 ssl http2;
    server_name www.stolix.ru;

    ssl_certificate     /etc/letsencrypt/live/stolix.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stolix.ru/privkey.pem;

    return 301 https://stolix.ru$request_uri;
}

# Main config
server {
    listen 443 ssl http2;
    server_name stolix.ru;

    ssl_certificate     /etc/letsencrypt/live/stolix.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stolix.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL_STOLIX:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Proxy everything to Next.js container
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 20M;
    }

    # Cache static assets via proxy
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
