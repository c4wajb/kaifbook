<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kaifbook</title>
    <style>
      :root {
        color: #2b211a;
        background: #f7efe4;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(rgba(107, 61, 46, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(107, 61, 46, 0.04) 1px, transparent 1px),
          #f7efe4;
        background-size: 56px 56px;
      }

      main {
        width: min(100%, 420px);
        padding: 28px;
        border: 1px solid rgba(212, 191, 168, 0.78);
        border-radius: 28px;
        background: rgba(255, 250, 244, 0.94);
        box-shadow: 0 24px 70px rgba(76, 50, 32, 0.14);
      }

      h1 {
        margin: 0 0 12px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 38px;
        line-height: 1;
      }

      p {
        margin: 0 0 22px;
        color: #756354;
        line-height: 1.5;
      }

      a {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 22px;
        border-radius: 999px;
        background: linear-gradient(135deg, #884b38, #c1734c);
        color: #fffaf2;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Kaifbook</h1>
      <p>Не удалось загрузить сайт. Проверьте интернет и откройте сервис ещё раз.</p>
      <a href="https://www.stolix.ru">Открыть Kaifbook</a>
    </main>
  </body>
</html>
